version: '3.9'

services:

  # ─── Contenedor de Base de Datos ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: django_cicd_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: django_cicd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Contenedor de la Aplicación Django ────────────────────────────────────
  web:
    build: .
    container_name: django_cicd_web
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: postgresql
      DB_NAME: django_cicd
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "dev-secret-key-solo-para-demo"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      db:
        condition: service_healthy

# ─── Volúmenes persistentes ────────────────────────────────────────────────────
volumes:
  postgres_data:
